[project]
name = "jurisatlas"
version = "2.0.0"
description = "Interactive GUI & CLI Setup Installer for JurisAtlas Legal MCP Servers (Unified & Standalone Modes, 42+ Jurisdictions)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JurisAtlas", email = "noreply@users.noreply.github.com"}]
keywords = ["legal-tech", "mcp", "model-context-protocol", "legislation", "case-law", "jurisatlas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://jurisatlas.github.io"
Repository = "https://github.com/jurisatlas/cli"
Issues = "https://github.com/jurisatlas/cli/issues"

[project.scripts]
jurisatlas = "jurisatlas_cli:main"

[tool.setuptools]
py-modules = ["jurisatlas_cli", "jurisatlas_i18n"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
